###############################
# ESPHome                     #
# TruMatic Implementation     #
# Truma 6DE                   #
###############################

esphome:
  name: trumatic
  friendly_name: TruMatic
  min_version: "2026.9.1"

external_components:
  - source: 
      type: git
      url: https://github.com/trinler007/esphome-truma.git
    components: [truma_inetbox, uart]
    refresh: 0s
     
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended # to reduce binary size
    sdkconfig_options:
      CONFIG_ESP32_REV_MIN: "3"

logger:
  level: DEBUG
  baud_rate: 115200 

# Optional: Home Assistant integration
api:
  encryption:
    key: !secret trumatic__encryption_key
  on_client_connected:
    - logger.log: "Home Assistant CONNECTED"
  on_client_disconnected:
    - logger.log: "Home Assistant DISCONNECTED"

ota:
  - platform: esphome
    password: !secret trumatic__ota_password

# Two network configurations
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  fast_connect: false
#  output_power: 17dB
  power_save_mode: none
  reboot_timeout: 0s
  on_connect:
    - logger.log: "WiFi CONNECTED"
  on_disconnect:
    - logger.log: "WiFi DISCONNECTED"

# Reconnect watchdog: if WiFi is lost, attempt soft-reconnect every 5 minutes
interval:
  - interval: 5min
    startup_delay: 2min
    then:
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - logger.log: "WiFi lost - attempting soft-reconnect"
            - wifi.disable:
            - delay: 5s
            - wifi.enable:

uart:
  - id: lin_uart_bus
    tx_pin: 15
    rx_pin: 14
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 2

time:
  - platform: homeassistant
    id: esptime
    # Set the Truma (CP Plus) clock automatically — re-syncs after a power loss
    on_time_sync:
      then:
        - truma_inetbox.clock.set:

truma_inetbox:
  uart_id: lin_uart_bus
  time_id: esptime
  lin_checksum: VERSION_2

climate:
  - platform: truma_inetbox
    name: "Truma Room"
    type: ROOM
    
  - platform: truma_inetbox
    name: "Truma Water"
    type: WATER

binary_sensor:
  - platform: truma_inetbox
    name: "CP Plus alive"
    type: CP_PLUS_CONNECTED

  - platform: truma_inetbox
    name: "Heater has error"
    type: HEATER_HAS_ERROR

  - platform: truma_inetbox
    name: "Room Heater active"
    type: HEATER_ROOM
    id: HEATER_ROOM

  - platform: truma_inetbox
    name: "Water Heater active"
    type: HEATER_WATER
    id: HEATER_WATER

  - platform: truma_inetbox
    name: "Heater mode Diesel"
    type: HEATER_DIESEL

  - platform: truma_inetbox
    name: "Heater mode Mix 1"
    type: HEATER_MIX_1
  
  - platform: truma_inetbox
    name: "Heater mode Mix 2"
    type: HEATER_MIX_2
  
  - platform: truma_inetbox
    name: "Heater mode Electric"
    type: HEATER_ELECTRICITY

  # Experimental, Combi D only: 230 V shore power present at the heater (LIN PID 0x16), not confirmed yet
  - platform: truma_inetbox
    name: "Heater Mains Power"
    type: HEATER_MAINS_POWER

  - platform: truma_inetbox
    name: "Timer active"
    type: TIMER_ACTIVE
    id: TIMER_ACTIVE

  - platform: truma_inetbox
    name: "Timer Room Heater active"
    type: TIMER_ROOM

  - platform: truma_inetbox
    name: "Timer Water Heater active"
    type: TIMER_WATER    

number:  
  - platform: truma_inetbox
    name: "Target Room Temperature"
    type: TARGET_ROOM_TEMPERATURE
 
  - platform: truma_inetbox
    name: "Target Water Temperature"
    type: TARGET_WATER_TEMPERATURE
 
  - platform: truma_inetbox
    name: "Electric Power Level"
    type: ELECTRIC_POWER_LEVEL

sensor:
  - platform: truma_inetbox
    name: "Current Room Temperature"
    type: CURRENT_ROOM_TEMPERATURE

  - platform: truma_inetbox
    name: "Current Water Temperature"
    type: CURRENT_WATER_TEMPERATURE

  - platform: truma_inetbox
    name: "Target Room Temperature"
    type: TARGET_ROOM_TEMPERATURE

  - platform: truma_inetbox
    name: "Target Water Temperature"
    type: TARGET_WATER_TEMPERATURE

  - platform: truma_inetbox
    name: "Heater Error Code"
    type: HEATER_ERROR_CODE

  - platform: truma_inetbox
    name: "Heating Mode"
    type: HEATING_MODE

  - platform: truma_inetbox
    name: "Electric Power Level"
    type: ELECTRIC_POWER_LEVEL

  - platform: truma_inetbox
    name: "Energy Mix"
    type: ENERGY_MIX

  - platform: truma_inetbox
    name: "Operating Status"
    type: OPERATING_STATUS

  - platform: internal_temperature
    name: "TruMatic Internal Temperature"    
 
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

  - platform: uptime
    name: "Uptime"

switch:
  - platform: template
    name: "Activate Room Heater"
    lambda: |-
      return id(HEATER_ROOM).state;
    turn_on_action:
      - truma_inetbox.heater.set_target_room_temperature:
          temperature: !lambda |-
            return 16;
          heating_mode: ECO
    turn_off_action:
      - truma_inetbox.heater.set_target_room_temperature:
          temperature: 0
 
  - platform: template
    name: "Activate Water Heater"
    lambda: |-
      return id(HEATER_WATER).state;
    turn_on_action:
      - truma_inetbox.heater.set_target_water_temperature:
          temperature: 80
    turn_off_action:
      - truma_inetbox.heater.set_target_water_temperature:
          temperature: 0
  
  - platform: template
    name: "Activate Water Heater (enum)"
    lambda: |-
      return id(HEATER_WATER).state;
    turn_on_action:
      - truma_inetbox.heater.set_target_water_temperature_enum:
          temperature: BOOST
    turn_off_action:
      - truma_inetbox.heater.set_target_water_temperature_enum: "OFF"
  
  - platform: template
    name: "Activate Timer"
    lambda: |-
      return id(TIMER_ACTIVE).state;
    turn_on_action:
      - truma_inetbox.timer.activate:
          start: 7:00
          stop: 7:45
          room_temperature: 18
          heating_mode: ECO
          water_temperature: 40
          energy_mix: DIESEL
          watt: 0
    turn_off_action:
      - truma_inetbox.timer.disable

select:
  - platform: truma_inetbox
    name: "Energy Mix"
    type: HEATER_ENERGY_MIX_DIESEL

  - platform: truma_inetbox
    name: "Fan Mode"
    type: HEATER_FAN_MODE_COMBI

web_server:
  port: 80
  local: true
  version: 3
  include_internal: true
  
# Optional: Bluetooth Proxy (uncomment to enable)
# esp32_ble_tracker:
#   scan_parameters:
#     interval: 1100ms
#     window: 1100ms
#     active: false

# bluetooth_proxy:
#   active: true

button:
  - platform: restart
    name: "Restart TruMatic"

# Alte Buttons
  - platform: template
    name: "Energy mix Diesel only"
    on_press:
      - logger.log: "Setting energy mix to Diesel only"
      - truma_inetbox.heater.set_energy_mix:
          # Set energy mix to: `GAS`, `MIX`, `ELECTRICITY`
          energy_mix: DIESEL
      - homeassistant.event:
          event: esphome.energy_mix_gas_pressed
          data:
            message: "diesel_pressed"
      - delay: 1s # Prevent rapid button presses

  - platform: template
    name: "Energy mix MIX 1"
    on_press:
      - truma_inetbox.heater.set_energy_mix:
          energy_mix: MIX
          # Set electricity level to `0`, `900`, `1800`
          watt: 900W
      - homeassistant.event:
          event: esphome.energy_mix_mix1_pressed
          data:
            message: "mix1_pressed"
      - delay: 1s
  - platform: template
    name: "Energy mix MIX 2"
    on_press:
      - truma_inetbox.heater.set_energy_mix:
          energy_mix: MIX
          watt: 1800
      - homeassistant.event:
          event: esphome.energy_mix_mix2_pressed
          data:
            message: "mix2_pressed"
      - delay: 1s
  - platform: template
    name: "Energy mix ELECTRICITY only"
    on_press:
      - truma_inetbox.heater.set_energy_mix:
          energy_mix: ELECTRICITY
          watt: 1800W
      - delay: 1s
  - platform: template
    name: "Set electric power level to 0 Watt"
    on_press:
      - truma_inetbox.heater.set_electric_power_level: 0
      - delay: 500ms
  - platform: template
    name: "Set electric power level to 900 Watt"
    on_press:
      - truma_inetbox.heater.set_electric_power_level: 900
      - delay: 500ms
  - platform: template
    name: "Set electric power level to 1800 Watt"
    on_press:
      - truma_inetbox.heater.set_electric_power_level: 1800
      - delay: 500ms

  - platform: template
    name: "Water heater to OFF"
    on_press:
      - truma_inetbox.heater.set_target_water_temperature_enum: "OFF"
      - homeassistant.event:
          event: esphome.water_temperature_off_pressed
          data:
            message: "water heater to OFF pressed"
      - delay: 500ms
  - platform: template
    name: "Water heater to ECO"
    on_press:
      - truma_inetbox.heater.set_target_water_temperature_enum: "ECO"
      - homeassistant.event:
          event: esphome.water_temperature_eco_pressed
          data:
            message: "water heater to ECO pressed"
      - delay: 500ms
  - platform: template
    name: "Water heater to HIGH"
    on_press:
      - truma_inetbox.heater.set_target_water_temperature_enum: "HIGH"
      - homeassistant.event:
          event: esphome.water_temperature_high_pressed
          data:
            message: "water heater to HIGH pressed"
      - delay: 500ms
  - platform: template
    name: "Water heater to BOOST"
    on_press:
      - truma_inetbox.heater.set_target_water_temperature_enum: "BOOST"
      - homeassistant.event:
          event: esphome.water_temperature_boost_pressed
          data:
            message: "water heater to BOOST pressed"
      - delay: 500ms
